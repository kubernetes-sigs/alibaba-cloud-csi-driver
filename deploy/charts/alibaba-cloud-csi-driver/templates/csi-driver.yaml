{{- if .Values.csi.disk.enabled }}
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: diskplugin.csi.alibabacloud.com
spec:
  attachRequired: true
  podInfoOnMount: true
{{- end }}
---
{{ if .Values.csi.nas.enabled }}
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: nasplugin.csi.alibabacloud.com
spec:
  attachRequired: false
  podInfoOnMount: true
{{- with .Values.csi.nas.tokenRequests }}
  tokenRequests:
{{- toYaml . | nindent 4 }}
{{- if semverCompare ">=1.35.0-0" $.Capabilities.KubeVersion.Version }}
  # Deliver that token in the publish secrets rather than the volume context, so
  # request logging strips it as the secret it is. Kubernetes 1.35+ only; older
  # clusters use the volume context, which the driver also reads.
  #
  # `helm template` renders against Helm's own built-in version, so pass
  # --kube-version when rendering for an older cluster with a strict client;
  # otherwise the unknown field is dropped on apply.
  serviceAccountTokenInSecrets: true
{{- end }}
{{- end }}
{{- if or .Values.csi.nas.tokenRequests .Values.csi.nas.requiresRepublish }}
  requiresRepublish: true
{{- end }}
{{- end }}
---
{{- if .Values.csi.oss.enabled }}
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: ossplugin.csi.alibabacloud.com
  annotations:
    addon.alibabacloud.com/force-apply: "true"
spec:
  attachRequired: true
  podInfoOnMount: true
{{- end }}
---
{{- if .Values.csi.local.enabled }}
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: localplugin.csi.alibabacloud.com
spec:
  attachRequired: false
  podInfoOnMount: true
{{- end }}
---
{{- if .Values.csi.bmcpfs.enabled }}
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: bmcpfsplugin.csi.alibabacloud.com
spec:
  attachRequired: true
  podInfoOnMount: true
  # Required for STS credential rotation: kubelet periodically re-invokes
  # NodePublishVolume with the latest nodePublishSecretRef contents.
  requiresRepublish: true
{{- end }}
{{- if .Values.csi.ens.enabled }}
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: ensplugin.csi.alibabacloud.com
spec:
  attachRequired: true
  podInfoOnMount: true
{{- end }}
---
{{- if .Values.csi.customfuse.enabled }}
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: customfuseplugin.csi.alibabacloud.com
spec:
  attachRequired: true
  podInfoOnMount: true
{{- end }}
