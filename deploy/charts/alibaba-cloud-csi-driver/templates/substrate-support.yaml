{{- if .Values.enableSubstrate }}
{{- include "substrate.validate" . }}
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: substrate.csi.alibabacloud.com
spec:
  attachRequired: false
  podInfoOnMount: true
{{- if .Values.substrate.storageClass.create }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.substrate.storageClass.name }}
provisioner: substrate.csi.alibabacloud.com
reclaimPolicy: Retain
volumeBindingMode: Immediate
{{- end }}
{{- if .Values.controller.enabled }}
{{- $endpoints := list }}
{{- if and .Values.csi.nas.enabled .Values.csi.nas.controller.enabled }}
{{- $endpoints = append $endpoints (dict "name" "nas" "driver" "nasplugin.csi.alibabacloud.com" "config" "substrate-nas" "port" 443 "target" 8443) }}
{{- end }}
{{- $endpoints = append $endpoints (dict "name" "bridge" "driver" "substrate.csi.alibabacloud.com" "config" "substrate-csi-bridge" "port" 444 "target" 8444) }}
---
apiVersion: v1
kind: Service
metadata:
  name: csi-provisioner
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: csi-provisioner
  ports:
    {{- range $endpoint := $endpoints }}
    - name: {{ $endpoint.name }}-grpc-tls
      port: {{ $endpoint.port }}
      targetPort: {{ $endpoint.target }}
    {{- end }}
{{- if .Values.substrate.createDriverConfig }}
{{- range $endpoint := $endpoints }}
---
apiVersion: ate.dev/v1alpha1
kind: CSIDriverConfig
metadata:
  name: {{ $endpoint.driver }}
spec:
  driverName: {{ $endpoint.driver }}
  controllerEndpoint: dns:///csi-provisioner.{{ $.Release.Namespace }}.svc:{{ $endpoint.port }}
  nodeSocketOverride: unix://{{ clean $.Values.deploy.kubeletRootDir }}/csi-plugins/{{ $endpoint.driver }}/csi.sock
  tls:
    enabled: true
    usePodIdentity: true
    serverName: csi-provisioner.{{ $.Release.Namespace }}.svc
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: csi-provisioner-substrate
  namespace: {{ .Release.Namespace }}
data:
  envoy.yaml: |
    # SDS needs a node identity. Without node.id and node.cluster Envoy refuses to
    # initialize the TlsCertificateSdsApi and exits at startup with "node 'id' and
    # 'cluster' are required. Set it either in 'node' config or via --service-node
    # and --service-cluster options." A bootstrap that only ever used inline
    # certificates does not need this block, so it is easy to miss when moving to SDS.
    node:
      id: csi-provisioner-substrate
      cluster: csi-provisioner
    static_resources:
      listeners:
        {{- range $endpoint := $endpoints }}
        - name: {{ $endpoint.name }}
          address:
            socket_address: {address: 0.0.0.0, port_value: {{ $endpoint.target }}}
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  require_client_certificate: true
                  common_tls_context:
                    alpn_protocols: [h2]
                    # Both secrets reach Envoy through filesystem SDS instead of an
                    # inline entry, because Envoy silently ignores watched_directory
                    # on an inline tls_certificates / validation_context in the
                    # bootstrap: the file is read once at startup and never again.
                    # kubelet rotates a projected podCertificate roughly daily, so an
                    # Envoy that never re-reads it starts failing every mTLS handshake
                    # with "x509: certificate has expired" about 24h after the Pod
                    # starts — while the Pod still reports Ready, so nothing detects
                    # it. The SDS resource files further down this ConfigMap carry the
                    # watched_directory that does take effect.
                    tls_certificate_sds_secret_configs:
                      - name: substrate_serving_cert
                        sds_config:
                          resource_api_version: V3
                          path_config_source: {path: /etc/envoy/sds-substrate-serving-cert.yaml}
                    validation_context_sds_secret_config:
                      name: substrate_client_validation
                      sds_config:
                        resource_api_version: V3
                        path_config_source: {path: /etc/envoy/sds-substrate-client-validation.yaml}
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: {{ $endpoint.name }}
                    codec_type: AUTO
                    route_config:
                      name: {{ $endpoint.name }}
                      virtual_hosts:
                        - name: {{ $endpoint.name }}
                          domains: ["*"]
                          routes:
                            - match: {prefix: /csi.v1.Controller/}
                              route: {cluster: {{ $endpoint.name }}, timeout: 0s}
                            - match: {prefix: /csi.v1.Identity/}
                              route: {cluster: {{ $endpoint.name }}, timeout: 0s}
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        {{- end }}
      clusters:
        {{- range $endpoint := $endpoints }}
        - name: {{ $endpoint.name }}
          connect_timeout: 5s
          type: STATIC
          http2_protocol_options: {}
          load_assignment:
            cluster_name: {{ $endpoint.name }}
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        pipe: {path: /csi/{{ $endpoint.driver }}/csi.sock}
        {{- end }}
  # SDS resources for the two podCertificate bundles the listeners above reference.
  # watched_directory has to live here and nowhere else: kubelet rotates a projected
  # volume by creating a new timestamped directory and atomically re-pointing the
  # ..data symlink inside it, which fires the directory watch and makes Envoy
  # re-read the bundle. This ConfigMap is mounted whole at /etc/envoy with no items
  # filter, so these keys appear as files with no volume or volumeMount change.
  #
  # Both bundles are leaf cert and key concatenated in one file, which is why
  # certificate_chain and private_key name the same path.
  sds-substrate-serving-cert.yaml: |
    resources:
    - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
      name: substrate_serving_cert
      tls_certificate:
        certificate_chain: {filename: /run/servicedns.podcert.ate.dev/credential-bundle.pem}
        private_key: {filename: /run/servicedns.podcert.ate.dev/credential-bundle.pem}
        watched_directory: {path: /run/servicedns.podcert.ate.dev}
  sds-substrate-client-validation.yaml: |
    resources:
    - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
      name: substrate_client_validation
      validation_context:
        trusted_ca: {filename: /run/podidentity.podcert.ate.dev/client-trust-bundle.pem}
        watched_directory: {path: /run/podidentity.podcert.ate.dev}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: csi-plugin-endpointslices
  namespace: {{ .Values.substrate.namespace | default "ate-system" }}
rules:
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: csi-plugin-endpointslices
  namespace: {{ .Values.substrate.namespace | default "ate-system" }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: csi-plugin-endpointslices
subjects:
- kind: ServiceAccount
  name: {{ .Values.deploy.nodeServiceAccount | default "alicloud-csi-node" }}
  namespace: {{ .Release.Namespace }}
{{- end }}
