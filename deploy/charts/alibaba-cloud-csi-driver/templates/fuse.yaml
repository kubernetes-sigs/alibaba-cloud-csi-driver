{{- if and .Values.csi.oss.enabled .Values.deploy.fuseNamespace }}

---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.deploy.fuseNamespace }}
  annotations:
    # Keep on uninstall: this namespace hosts on-demand fuse pods that may be
    # serving live mounts; deleting it would tear them down.
    helm.sh/resource-policy: keep

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: csi-fuse-ossfs
  namespace: {{ .Values.deploy.fuseNamespace }}
  annotations:
    helm.sh/resource-policy: keep

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alicloud-csi-provisioner
  namespace: {{ .Values.deploy.fuseNamespace }}
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - create
  - delete
  - deletecollection
  - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alicloud-csi-provisioner
  namespace: {{ .Values.deploy.fuseNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alicloud-csi-provisioner
subjects:
- kind: ServiceAccount
  name: alicloud-csi-provisioner
  namespace: {{ .Release.Namespace }}

{{- end }}
