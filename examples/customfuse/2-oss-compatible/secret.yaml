apiVersion: v1
kind: Secret
metadata:
  name: juicefs-oss-creds
  namespace: default
type: Opaque
stringData:
  # Secret keys are passed as env vars to the entrypoint with the same name.
  # The entrypoint in this demo expects accessKeyId and accessKeySecret.
  #
  # AK/SK compatibility: an existing Secret using the OSS-style keys
  # (akId/akSecret) works too — this demo's entrypoint resolves them onto
  # $accessKeyId / $accessKeySecret itself. mount-proxy forwards every Secret
  # key under its own name, so which spellings an adapter accepts is up to it.
  accessKeyId: "<your-access-key-id>"
  accessKeySecret: "<your-access-key-secret>"
